{% extends "layout.html" %} {% block title %}Main{% endblock %} {% block body %}
<div class="alert alert-danger" role="alert" id="alert" {% if error == " " %}style="display:none;"{% endif %}>
  {{error}}
</div>
<div id="container1">
  <h1>Weather app, track the weather in your area</h1>
</div>
<hr />
<div id="container2">
  <div class="container">
    <form action="/" method="post">
      <h2>Contact Me</h2>
      <div class="row">
        <div class="col-25">
          <label for="fname">Email</label>
        </div>
        <div class="col-75">
          <input
            type="email"
            id="fname"
            name="mail"
            placeholder="E-mail"
          />
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label for="lname">Subject</label>
        </div>
        <div class="col-75">
          <input
            type="text"
            id="lname"
            name="subject"
            placeholder="Subject..."
          />
        </div>
      </div>
      <div class="row">
        <div class="col-25">
          <label for="subject">Body</label>
        </div>
        <div class="col-75">
          <textarea
            id="subject"
            name="body"
            placeholder="Body..."
            style="height: 200px"
          ></textarea>
        </div>
      </div>
      <br />
      <div class="row">
        <input type="submit" value="Submit" />
      </div>
    </form>
  </div>
  <img src="..\static\chisinau.jpg" alt="chisinau" width="600px" style="margin-right: 10px;">
</div>

{% endblock %} {% block head %}
<style>
  #alert{
    margin: 0px !important;
  }
  h2 {
    margin: 0px 0px 10px 0px;
    text-align: center;
  }
  iframe {
    margin: 26px 20px 0px 0px;
    width: 40%;
    border: 0;
  }
  #container2 {
    display: flex;
    justify-content: space-around;
    margin-bottom: 10px;
  }
  #container1 {
    text-align: center;
    background-image: url("../static/weather.png");
    background-size: cover;
    width: auto;
    height: 100%;
    align-items: center;
    justify-content: center;
    display: flex;
    margin-bottom: 5%;
  }
  h1 {
    margin: 0px;
    z-index: 10;
    font-size: 5rem;
    width: 60%;
    color: black;
    opacity: 0.9;
    padding: 50px 0px 50px 0px;
    border: 10px solid black;
  }
  @media screen and (max-width: 1000px) {
    h1 {
      font-size: 2rem;
    }
    .container {
      border: 0px !important;
      width: 80% !important;
      margin: 0px;
    }
    #container2 {
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #end{
      margin: 0px !important;
    }
  }
  input[type="text"],input[type="email"],
  select,
  textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    resize: none;
  }

  label {
    padding: 12px 12px 12px 0;
    display: inline-block;
  }

  input[type="submit"] {
    background-color: #0ea5e9;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: 0.3s;
  }

  input[type="submit"]:hover {
    background-color: #0c4a6e;
  }

  .container {
    width: 50%;
    background-color: #f2f2f2;
    padding: 0px 20px 20px 20px;
    margin-left: 20px;
    border-right: 1px solid grey;
  }

  .col-25 {
    width: 25%;
    margin-top: 6px;
  }

  .col-75 {
    width: 75%;
    margin-top: 6px;
  }

  /* Clear floats after the columns */
  .row:after {
    content: "";
    display: table;
    clear: both;
  }

  /* Responsive layout - when the screen is less than 600px wide, make the two columns stack on top of each other instead of next to each other */
  @media screen and (max-width: 600px) {
    .col-25,
    .col-75,
    input[type="submit"] {
      width: 100%;
      margin-top: 0;
    }
  }
</style>
{% endblock %}
